<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Buku - E-Perpustakaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/shared/variables.css">
  <link rel="stylesheet" href="../../css/shared/base.css">
  <link rel="stylesheet" href="../../css/shared/utilities.css">
  <link rel="stylesheet" href="../../css/shared/components.css">
  <link rel="stylesheet" href="../../css/shared/layout.css">
<link rel="stylesheet" href="../../css/shared/responsive.css">
<link rel="stylesheet" href="../../css/anggota/anggota.css?v=20261123-clean">
</head>
<body class="detail-page">
<svg aria-hidden="true" class="icon-sprite">
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <path d="m16 17 5-5-5-5"></path>
      <path d="M21 12H9"></path>
    </symbol>
    <symbol id="i-trend" viewBox="0 0 24 24">
      <path d="m22 7-8.5 8.5-5-5L2 17"></path>
      <path d="M16 7h6v6"></path>
    </symbol>
  </svg>
<header class="site-header">
    <div class="site-header__inner">
<div class="brand" aria-label="E-Perpustakaan">
        <span class="brand__icon">
          <svg class="icon" aria-hidden="true">
            <use href="#i-book"></use>
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">E-Perpustakaan</span>
          <span class="brand__sub">Universitas Khairun</span>
        </span>
      </div>
<nav aria-label="Menu utama" class="main-nav">
        <ul class="main-nav__list">
          <li>
            <a
              class="main-nav__link"
              data-route="beranda.html"
              href="beranda.html">beranda</a>
          </li>
          <li>
            <a
              class="main-nav__link main-nav__link--active"
              aria-current="page"
              data-route="cari.html"
              href="cari.html">cari buku</a>
          </li>
          <li>
            <a
              class="main-nav__link main-nav__link--logout"
              data-route="../auth/login/anggota.html"
              href="../auth/login/anggota.html">
              keluar
              <svg class="icon icon--sm" aria-hidden="true">
                <use href="#i-logout"></use>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
<main class="page">
    <article
      class="panel book-detail"
      data-book-detail>
<div class="book-detail__cover-column">
        <figure class="cover cover--large book-detail__cover">
          <img
            alt="Sampul buku"
            class="cover__image"
            data-book-image
            hidden
            loading="eager"
          >
          <div
            class="book-cover-placeholder"
            data-book-cover-placeholder
            aria-live="polite">
            Memuat sampul buku...
          </div>
        </figure>
<button
          class="btn btn--navy btn--block book-detail__borrow"
          data-action="borrow"
          disabled
          type="button">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-book"></use>
          </svg>
          <span data-borrow-label>Pinjam Buku</span>
        </button>
      </div>
<div class="book-detail__content">
        <h1
          class="book-detail__title"
          data-book-title>Memuat data buku...</h1>
<dl class="book-detail__meta">
          <div>
            <dt>ID</dt>
            <dd data-book-id>—</dd>
          </div>
          <div>
            <dt>Penulis</dt>
            <dd data-book-author>—</dd>
          </div>
          <div>
            <dt>Kategori</dt>
            <dd data-book-category>—</dd>
          </div>
        </dl>
<p>
          Stok tersedia :
          <span
            class="stock-badge"
            data-book-stock>—</span>
        </p>
<h2 class="book-detail__label">Deskripsi buku :</h2>
        <p
          class="book-detail__description"
          data-book-description>Memuat deskripsi buku...</p>
<p class="book-detail__stat">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-trend"></use>
          </svg>
          <strong data-book-borrow-count>—</strong>
          <span data-book-borrow-extra></span>
        </p>
      </div>
    </article>
<p
      data-detail-message
      aria-live="polite"
      role="status"
      hidden>
    </p>
<section>
      <h2 class="section-title">Buku Serupa</h2>
      <div
        class="book-grid"
        data-related-books>
        <p>Memuat rekomendasi buku...</p>
      </div>
    </section>
  </main>
<script defer src="../../js/shared/app.js"></script>
<script defer src="../../js/shared/covers.js?v=20261123-coverfix"></script>
  <script defer src="../../js/anggota/detail.js?v=20261123-coverfix"></script>
  <script defer src="../../js/anggota/transaksi.js"></script>
</body>
</html>
